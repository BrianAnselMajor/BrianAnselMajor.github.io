<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brian Ansel Major | Official Artist Website</title>
<meta name="description" content="Official website of Brian Ansel Major — independent songwriter and recording artist.">
<style>
:root{--bg:#0b0b0b;--panel:#151515;--text:#f5f2eb;--muted:#aaa59d;--line:#2a2927;--accent:#d9c4a1}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;line-height:1.6}
a{color:inherit;text-decoration:none}
nav{position:sticky;top:0;z-index:10;background:rgba(11,11,11,.95);border-bottom:1px solid var(--line);padding:16px 7%;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;letter-spacing:1px}
nav div:last-child{display:flex;gap:20px;font-size:14px}
nav a:hover{color:var(--accent)}
.hero{min-height:82vh;display:flex;align-items:center;padding:80px 7%;background:radial-gradient(circle at 75% 35%,#30291f 0,#17130f 22%,#0b0b0b 55%)}
.hero-inner{max-width:850px}
.kicker{color:var(--accent);text-transform:uppercase;letter-spacing:4px;font-size:13px}
h1{font-size:clamp(52px,10vw,105px);line-height:.92;margin:18px 0}
.hero p{font-size:20px;color:var(--muted);max-width:650px}
.buttons{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.btn{display:inline-block;padding:13px 20px;border:1px solid var(--line);border-radius:5px;background:#171717}
.btn.primary{background:var(--accent);color:#111;border-color:var(--accent);font-weight:700}
section{padding:85px 7%;border-bottom:1px solid var(--line)}
.container{max-width:1100px;margin:auto}
h2{font-size:38px;margin:0 0 20px}
.lead{font-size:20px;color:var(--muted);max-width:780px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:35px}
.card{background:var(--panel);border:1px solid var(--line);padding:28px;border-radius:8px}
.card h3{margin-top:0;font-size:23px}
.card p{color:var(--muted)}
.socials{display:flex;flex-wrap:wrap;gap:12px;margin-top:25px}
footer{padding:35px 7%;color:var(--muted);text-align:center;font-size:14px}
@media(max-width:700px){
nav{align-items:flex-start;gap:12px}nav div:last-child{gap:10px;font-size:12px;flex-wrap:wrap;justify-content:flex-end}
.hero{min-height:75vh;padding-top:60px}
.grid{grid-template-columns:1fr}
section{padding:60px 7%}
h2{font-size:32px}
}
</style>
</head>
<body>

<nav>
<div class="logo">BRIAN ANSEL MAJOR</div>
<div>
<a href="#story">Story</a>
<a href="#music">Music</a>
<a href="#connect">Connect</a>
</div>
</nav>

<div class="hero-inner">
<div class="kicker">Official Artist Website</div>

<p>Independent songwriter and recording artist creating music from the places where real life, love, struggle and resilience meet.</p>
